<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08090a" />
    <meta
      name="description"
      content="RepoPilot is an AI engineering intelligence platform that understands your codebase, its dependencies, its history, and the impact of every change."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RepoPilot — Understand your codebase before you change it" />
    <meta
      property="og:description"
      content="A living model of architecture, dependencies, Git history, and pull requests. Answers with evidence, not speculation."
    />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RepoPilot — Understand your codebase before you change it" />
    <meta
      name="twitter:description"
      content="A living model of architecture, dependencies, Git history, and pull requests. Answers with evidence, not speculation."
    />
    <meta name="twitter:image" content="/og.png" />
    <title>RepoPilot — Understand your codebase before you change it</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("repopilot-theme");
          var dark = theme !== "light";
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.classList.toggle("light", !dark);
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
